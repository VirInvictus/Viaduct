name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# One run per ref at a time; a pushed fix cancels the superseded run
# instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # viaduct requires gtk4 >= 4.16 (v4_16); Ubuntu runners ship 4.14.5, so
    # the build aborts in gdk4-sys before a single crate of ours compiles.
    # That is why this workflow had never once gone green on ubuntu-24.04.
    # Fedora carries a new-enough GTK, and the same container pattern is
    # already proven in Atrium and Colophon. rusqlite is bundled, so it
    # compiles from source and needs only a C toolchain.
    container: fedora:43
    steps:
      - name: Install system dependencies
        # --disablerepo=fedora-cisco-openh264: webkitgtk6.0-devel pulls
        # openh264, which Fedora hosts on ciscobinary.openh264.org rather than
        # in its own mirrors. That host is unreachable from GitHub runners and
        # fails the whole transaction. We only need headers to compile, so the
        # codec is irrelevant; --setopt=install_weak_deps=False drops it and
        # the rest of the runtime-only baggage too.
        run: |
          dnf install -y \
            --disablerepo=fedora-cisco-openh264 \
            --setopt=install_weak_deps=False \
            gcc \
            git \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            webkitgtk6.0-devel \
            sqlite-devel \
            openssl-devel \
            xorg-x11-server-Xvfb

      # Pinned to the v4 tag's SHA (actions hardening, final audit L6.8).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: cargo-sources.json freshness guard
        # The Flatpak offline build vendors crates from the generated
        # manifest; a lock change without the regen leaves it pinning
        # stale crates or a stale vir-gtk checkout. Fail CI whenever the
        # checked-in file disagrees with Cargo.lock (the Atrium guard
        # shape; it bit Atrium at v0.70.0 and again at v0.72.1).
        # Container jobs run as root against a host-owned checkout, so
        # git's dubious-ownership check rejects the repo and `git diff`
        # silently degrades to --no-index (exit 129); mark the workspace
        # safe before touching git.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run scripts/flatpak-cargo-generator.py Cargo.lock -o data/cargo-sources.json
          git diff --exit-code data/cargo-sources.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # No current test calls gtk::init(), but the binary crate links gtk4
        # and webkit6 and a widget test could land later; running under xvfb
        # keeps a display available so the suite never depends on a headful
        # runner. Matches the Colophon/Atrium convention.
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a cargo test --workspace
